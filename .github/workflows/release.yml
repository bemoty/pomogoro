name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          brew install imagemagick msitools
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate icons
        run: bash scripts/gen-icons.sh

      - name: Build macOS binaries
        run: |
          mkdir -p artifacts
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o artifacts/pomogoro-darwin-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o artifacts/pomogoro-darwin-amd64 .

      - name: Package macOS DMGs
        run: bash scripts/package-macos.sh "${{ github.ref_name }}"

      - name: Build Windows binary
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H windowsgui" -o artifacts/pomogoro-windows-amd64.exe .

      - name: Package MSI
        run: bash scripts/package-msi.sh "${{ github.ref_name }}"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Upload macOS and Windows installers
        run: gh release upload "${{ github.ref_name }}" artifacts/pomogoro-arm64.dmg artifacts/pomogoro-amd64.dmg artifacts/pomogoro-amd64.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew cask
        run: bash scripts/update-cask.sh "${{ github.ref_name }}"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
